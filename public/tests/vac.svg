<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" preserveAspectRatio="xMidYMid slice" role="img" aria-label="VAC — Mapa Sensorial da Comunicação">
  <defs>
    <linearGradient id="bgVAC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f0e8"/>
      <stop offset="1" stop-color="#e8e0cf"/>
    </linearGradient>
  </defs>

  <rect width="800" height="280" fill="url(#bgVAC)"/>

  <!-- Decorative grain dots -->
  <g opacity="0.05" fill="#1c1a17">
    <circle cx="80"  cy="60"  r="1.5"/>
    <circle cx="60"  cy="220" r="1.5"/>
    <circle cx="160" cy="240" r="1.5"/>
    <circle cx="730" cy="50"  r="1.5"/>
    <circle cx="700" cy="210" r="1.5"/>
    <circle cx="120" cy="80"  r="1.5"/>
  </g>

  <!-- Venn diagram (3 overlapping channels) -->
  <g transform="translate(550 140)">
    <!-- V: Visual (indigo) -->
    <circle cx="-44" cy="-26" r="78" fill="#3d4f7c" fill-opacity="0.32" stroke="#3d4f7c" stroke-width="2" stroke-opacity="0.55"/>
    <!-- A: Auditivo (terracota) -->
    <circle cx="44"  cy="-26" r="78" fill="#c4633a" fill-opacity="0.32" stroke="#c4633a" stroke-width="2" stroke-opacity="0.55"/>
    <!-- S: Sinestésico (sage) -->
    <circle cx="0"   cy="44"  r="78" fill="#7a9e7e" fill-opacity="0.32" stroke="#7a9e7e" stroke-width="2" stroke-opacity="0.55"/>

    <!-- Channel labels (single letter) -->
    <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="34" text-anchor="middle">
      <text x="-78" y="-48" fill="#3d4f7c">V</text>
      <text x="78"  y="-48" fill="#c4633a">A</text>
      <text x="0"   y="100" fill="#7a9e7e">S</text>
    </g>

    <!-- Center dot (convergence point) -->
    <circle cx="0" cy="0" r="6" fill="#1c1a17" fill-opacity="0.55"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#1c1a17" stroke-opacity="0.25" stroke-width="1.2"/>
  </g>

  <!-- Title (top left) -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#1c1a17">
    <text x="50" y="80" font-size="34" font-weight="700">VAC</text>
    <text x="50" y="108" font-size="14" font-style="italic" fill="#6e645a">Visual, Auditivo ou Sinestésico, qual é o seu canal?</text>
  </g>

  <!-- Three side tags (left column) -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2">
    <g transform="translate(50 150)">
      <circle cx="6" cy="6" r="5" fill="#3d4f7c"/>
      <text x="22" y="10" fill="#3d4f7c">VISUAL</text>
    </g>
    <g transform="translate(50 180)">
      <circle cx="6" cy="6" r="5" fill="#c4633a"/>
      <text x="22" y="10" fill="#c4633a">AUDITIVO</text>
    </g>
    <g transform="translate(50 210)">
      <circle cx="6" cy="6" r="5" fill="#7a9e7e"/>
      <text x="22" y="10" fill="#7a9e7e">SINESTÉSICO</text>
    </g>
  </g>
</svg>
