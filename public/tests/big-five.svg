<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Big Five — Estilo de Liderança">
  <defs>
    <linearGradient id="bgBF" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1626"/>
      <stop offset="1" stop-color="#080d18"/>
    </linearGradient>
    <radialGradient id="centerGlowBF" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgBF)"/>

  <!-- grain dots -->
  <g opacity="0.10" fill="#ffffff">
    <circle cx="80"  cy="70"  r="1.6"/>
    <circle cx="170" cy="440" r="1.6"/>
    <circle cx="730" cy="80"  r="1.6"/>
    <circle cx="690" cy="420" r="1.6"/>
    <circle cx="60"  cy="300" r="1.6"/>
    <circle cx="745" cy="450" r="1.6"/>
  </g>

  <!-- Radar -->
  <g transform="translate(400 288)">
    <circle r="150" fill="url(#centerGlowBF)"/>

    <!-- concentric pentagons -->
    <g fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1">
      <polygon points="0,-118 112.2,-36.5 69.4,95.5 -69.4,95.5 -112.2,-36.5"/>
      <polygon points="0,-79 75.1,-24.4 46.4,63.9 -46.4,63.9 -75.1,-24.4"/>
      <polygon points="0,-39 37.1,-12.1 22.9,31.6 -22.9,31.6 -37.1,-12.1"/>
    </g>

    <!-- spokes -->
    <g stroke="#ffffff" stroke-opacity="0.14" stroke-width="1">
      <line x1="0" y1="0" x2="0"      y2="-118"/>
      <line x1="0" y1="0" x2="112.2"  y2="-36.5"/>
      <line x1="0" y1="0" x2="69.4"   y2="95.5"/>
      <line x1="0" y1="0" x2="-69.4"  y2="95.5"/>
      <line x1="0" y1="0" x2="-112.2" y2="-36.5"/>
    </g>

    <!-- profile polygon -->
    <polygon points="0,-98 92,-30 50,72 -55,68 -88,-29"
      fill="#d4af37" fill-opacity="0.22" stroke="#d4af37" stroke-width="2.5"/>

    <!-- 5 nodes -->
    <g>
      <circle cx="0"      cy="-118" r="10" fill="#d98a5a"/><circle cx="0"      cy="-118" r="4.5" fill="#0e1626"/>
      <circle cx="112.2"  cy="-36.5" r="10" fill="#7fb08a"/><circle cx="112.2"  cy="-36.5" r="4.5" fill="#0e1626"/>
      <circle cx="69.4"   cy="95.5"  r="10" fill="#5b7cc4"/><circle cx="69.4"   cy="95.5"  r="4.5" fill="#0e1626"/>
      <circle cx="-69.4"  cy="95.5"  r="10" fill="#d4af37"/><circle cx="-69.4"  cy="95.5"  r="4.5" fill="#0e1626"/>
      <circle cx="-112.2" cy="-36.5" r="10" fill="#c47a72"/><circle cx="-112.2" cy="-36.5" r="4.5" fill="#0e1626"/>
    </g>
  </g>

  <!-- Title -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="60" y="118" font-size="50" font-weight="700" fill="#f3ede0">Big Five</text>
    <text x="60" y="152" font-size="17" font-style="italic" fill="#9fb0c8">A ciência por trás do seu jeito de liderar</text>
  </g>

  <!-- bottom tag -->
  <g transform="translate(60 430)">
    <rect width="248" height="34" rx="17" fill="#d4af37" fill-opacity="0.10" stroke="#d4af37" stroke-opacity="0.30"/>
    <text x="124" y="22" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#d4af37" letter-spacing="2">5 FATORES · 4 ARQUÉTIPOS</text>
  </g>
</svg>
