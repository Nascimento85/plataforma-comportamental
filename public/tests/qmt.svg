<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet" role="img" aria-label="QMT — Quociente Mental Triádico">
  <defs>
    <linearGradient id="bgQMT" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1626"/>
      <stop offset="1" stop-color="#080d18"/>
    </linearGradient>
    <radialGradient id="glowQMT" cx="0.6" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgQMT)"/>
  <rect width="800" height="500" fill="url(#glowQMT)"/>

  <!-- grain -->
  <g opacity="0.10" fill="#ffffff">
    <circle cx="80" cy="70" r="1.6"/><circle cx="60" cy="430" r="1.6"/>
    <circle cx="740" cy="60" r="1.6"/><circle cx="710" cy="430" r="1.6"/>
    <circle cx="130" cy="100" r="1.6"/>
  </g>

  <!-- Triângulo triádico -->
  <g transform="translate(545 270)">
    <!-- conexões -->
    <g stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5">
      <line x1="0" y1="-110" x2="-95" y2="60"/>
      <line x1="0" y1="-110" x2="95" y2="60"/>
      <line x1="-95" y1="60" x2="95" y2="60"/>
    </g>
    <!-- linhas ao centro -->
    <g stroke="#d4af37" stroke-opacity="0.25" stroke-width="1">
      <line x1="0" y1="0" x2="0" y2="-110"/>
      <line x1="0" y1="0" x2="-95" y2="60"/>
      <line x1="0" y1="0" x2="95" y2="60"/>
    </g>
    <!-- nó central -->
    <circle cx="0" cy="0" r="7" fill="#d4af37"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#d4af37" stroke-opacity="0.4" stroke-width="1.2"/>

    <!-- C: Conceitual (topo, dourado) -->
    <circle cx="0" cy="-110" r="13" fill="#d8b95c"/><circle cx="0" cy="-110" r="6" fill="#0e1626"/>
    <!-- I: Intuitivo (esq, rosa) -->
    <circle cx="-95" cy="60" r="13" fill="#cf8b83"/><circle cx="-95" cy="60" r="6" fill="#0e1626"/>
    <!-- P: Processual (dir, azul) -->
    <circle cx="95" cy="60" r="13" fill="#6f86c9"/><circle cx="95" cy="60" r="6" fill="#0e1626"/>

    <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="22" text-anchor="middle">
      <text x="0" y="-134" fill="#e7d39a">C</text>
      <text x="-120" y="70" fill="#efb0a8">I</text>
      <text x="120" y="70" fill="#9fb1e6">P</text>
    </g>
  </g>

  <!-- Título -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="60" y="118" font-size="50" font-weight="700" fill="#f3ede0">QMT</text>
    <text x="60" y="152" font-size="17" font-style="italic" fill="#9fb0c8">Como a sua mente pensa: estratégia, pessoas ou execução?</text>
  </g>

  <!-- Legenda -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">
    <g transform="translate(60 250)"><circle cx="7" cy="6" r="6" fill="#d8b95c"/><text x="28" y="11" fill="#e7d39a">CONCEITUAL</text></g>
    <g transform="translate(60 300)"><circle cx="7" cy="6" r="6" fill="#cf8b83"/><text x="28" y="11" fill="#efb0a8">INTUITIVO</text></g>
    <g transform="translate(60 350)"><circle cx="7" cy="6" r="6" fill="#6f86c9"/><text x="28" y="11" fill="#9fb1e6">PROCESSUAL</text></g>
  </g>

  <g transform="translate(60 420)">
    <rect width="240" height="34" rx="17" fill="#d4af37" fill-opacity="0.10" stroke="#d4af37" stroke-opacity="0.30"/>
    <text x="120" y="22" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#d4af37" letter-spacing="2">COMPORTAMENTAL · COGNIÇÃO</text>
  </g>
</svg>
