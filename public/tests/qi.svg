<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Teste de QI e Raciocínio Lógico">
  <defs>
    <linearGradient id="qiBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15130f"/>
      <stop offset="1" stop-color="#241d12"/>
    </linearGradient>
    <linearGradient id="qiGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6c869"/>
      <stop offset="1" stop-color="#d4943a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#qiBg)"/>

  <!-- grade sutil -->
  <g stroke="#c9a84c" stroke-opacity="0.08" stroke-width="1">
    <path d="M0 125 H800 M0 250 H800 M0 375 H800 M200 0 V500 M400 0 V500 M600 0 V500"/>
  </g>

  <!-- nós conectados (raciocínio em rede) -->
  <g stroke="url(#qiGold)" stroke-opacity="0.55" stroke-width="2" fill="none">
    <path d="M250 180 L400 120 L560 200 M400 120 L420 280 L250 320 M420 280 L580 330"/>
  </g>
  <g fill="url(#qiGold)">
    <circle cx="250" cy="180" r="9"/>
    <circle cx="400" cy="120" r="11"/>
    <circle cx="560" cy="200" r="9"/>
    <circle cx="420" cy="280" r="10"/>
    <circle cx="250" cy="320" r="8"/>
    <circle cx="580" cy="330" r="8"/>
  </g>

  <!-- símbolos lógicos nos nós -->
  <g fill="#15130f" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="11" text-anchor="middle">
    <text x="400" y="124">Σ</text>
    <text x="420" y="284">∴</text>
  </g>

  <!-- selo QI -->
  <g transform="translate(400,250)">
    <circle r="58" fill="none" stroke="url(#qiGold)" stroke-width="3" stroke-opacity="0.85"/>
    <text x="0" y="20" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="56" fill="url(#qiGold)">QI</text>
  </g>

  <!-- título -->
  <text x="400" y="420" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="600" font-size="34" fill="#f3ead6">Raciocínio Lógico</text>
  <text x="400" y="452" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="15" letter-spacing="3" fill="#d4b85c">LÓGICO · ANALÍTICO · VERBAL · SEQUÊNCIAS</text>
</svg>
