<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Mapa da Comunicação">
  <defs>
    <linearGradient id="bgCOM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1626"/>
      <stop offset="1" stop-color="#080d18"/>
    </linearGradient>
    <radialGradient id="glowCOM" cx="0.62" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="thermoCOM" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#d9695a"/>
      <stop offset="0.4" stop-color="#c08a5c"/>
      <stop offset="0.62" stop-color="#d8b95c"/>
      <stop offset="1" stop-color="#74d6a0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgCOM)"/>
  <rect width="800" height="500" fill="url(#glowCOM)"/>

  <!-- grain -->
  <g opacity="0.10" fill="#ffffff">
    <circle cx="80" cy="70" r="1.6"/><circle cx="60" cy="430" r="1.6"/>
    <circle cx="740" cy="60" r="1.6"/><circle cx="700" cy="440" r="1.6"/>
    <circle cx="130" cy="100" r="1.6"/>
  </g>

  <!-- Balões de fala (três camadas) -->
  <g transform="translate(470 250)">
    <!-- balão grande (estilo) -->
    <g>
      <rect x="0" y="-110" width="190" height="92" rx="22" fill="#1b2030" stroke="#d8b95c" stroke-opacity="0.55" stroke-width="2"/>
      <path d="M40 -18 L62 -18 L40 6 Z" fill="#1b2030" stroke="#d8b95c" stroke-opacity="0.55" stroke-width="2"/>
      <circle cx="55" cy="-64" r="7" fill="#d8b95c"/>
      <circle cx="95" cy="-64" r="7" fill="#cf8b83"/>
      <circle cx="135" cy="-64" r="7" fill="#86b58a"/>
    </g>
    <!-- balão médio (energia social) -->
    <g transform="translate(118 30)">
      <rect x="0" y="0" width="150" height="74" rx="20" fill="#161b29" stroke="#6f86c9" stroke-opacity="0.55" stroke-width="2"/>
      <path d="M118 74 L138 74 L138 98 Z" fill="#161b29" stroke="#6f86c9" stroke-opacity="0.55" stroke-width="2"/>
      <rect x="22" y="30" width="64" height="6" rx="3" fill="#6f86c9"/>
      <rect x="22" y="46" width="100" height="6" rx="3" fill="#6f86c9" fill-opacity="0.5"/>
    </g>
    <!-- nó dourado central -->
    <circle cx="118" cy="14" r="6" fill="#d4af37"/>
    <circle cx="118" cy="14" r="15" fill="none" stroke="#d4af37" stroke-opacity="0.35" stroke-width="1.2"/>
  </g>

  <!-- Termômetro de assertividade -->
  <g transform="translate(700 120)">
    <rect x="-9" y="0" width="18" height="210" rx="9" fill="#10182a" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="-9" y="60" width="18" height="150" rx="9" fill="url(#thermoCOM)"/>
    <circle cx="0" cy="232" r="20" fill="url(#thermoCOM)"/>
    <circle cx="0" cy="232" r="20" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="0" y="-12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" fill="#74d6a0">CNV</text>
  </g>

  <!-- Título -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="60" y="118" font-size="44" font-weight="700" fill="#f3ede0">Mapa da Comunicação</text>
    <text x="60" y="152" font-size="17" font-style="italic" fill="#9fb0c8">Como você fala, escuta e se posiciona sob pressão.</text>
  </g>

  <!-- Legenda -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">
    <g transform="translate(60 232)"><circle cx="7" cy="6" r="6" fill="#d8b95c"/><text x="28" y="11" fill="#e7d39a">ESTILO DE COMUNICAÇÃO</text></g>
    <g transform="translate(60 280)"><circle cx="7" cy="6" r="6" fill="#6f86c9"/><text x="28" y="11" fill="#9fb1e6">ENERGIA SOCIAL</text></g>
    <g transform="translate(60 328)"><circle cx="7" cy="6" r="6" fill="#74d6a0"/><text x="28" y="11" fill="#9fe0bc">ASSERTIVIDADE (CNV)</text></g>
  </g>

  <g transform="translate(60 420)">
    <rect width="240" height="34" rx="17" fill="#d4af37" fill-opacity="0.10" stroke="#d4af37" stroke-opacity="0.30"/>
    <text x="120" y="22" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#d4af37" letter-spacing="2">COMPORTAMENTAL · AUTORAL</text>
  </g>
</svg>
